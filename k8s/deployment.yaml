apiVersion: apps/v1
kind: Deployment
metadata:
  name: krona-backend
  namespace: krona
  labels:
    app: krona-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: krona-backend
  template:
    metadata:
      labels:
        app: krona-backend
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/nulp-ai-enterprise/krona-backend:sha-02e290c
          command: ["python", "manage.py", "migrate", "--noinput"]
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: krona-backend-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: krona-backend-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: krona-backend-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: krona-backend-secret
                  key: POSTGRES_HOST
            - name: ELASTICSEARCH_HOST
              valueFrom:
                secretKeyRef:
                  name: krona-backend-secret
                  key: ELASTICSEARCH_HOST
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: krona-backend-secret
                  key: DJANGO_SECRET_KEY
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: krona-backend
          image: ghcr.io/nulp-ai-enterprise/krona-backend:sha-02e290c
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: krona-backend-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: krona-backend-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: krona-backend-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: krona-backend-secret
                  key: POSTGRES_HOST
            - name: ELASTICSEARCH_HOST
              valueFrom:
                secretKeyRef:
                  name: krona-backend-secret
                  key: ELASTICSEARCH_HOST
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: krona-backend-secret
                  key: DJANGO_SECRET_KEY
            - name: ALLOWED_HOSTS
              value: "krona-api.thesis-i.com"
            - name: CORS_ORIGINS
              value: "https://krona.thesis-i.com"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health/
              port: 8000
            failureThreshold: 12
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      imagePullSecrets:
        - name: ghcr-secret
